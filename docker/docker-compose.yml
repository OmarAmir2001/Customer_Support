
# Lives in docker/ but is built and run against the REPO ROOT.
#
# Compose resolves relative paths in this file against THIS directory, and takes
# its project directory (where it looks for `.env` to expand ${...}) from here
# too. So every path below points up, and the documented command passes
# --project-directory .. so the root .env is found for substitution.
#
# `name:` is pinned rather than derived from the directory name. Without it the
# project would have been renamed by this move, and Compose would have created a
# fresh customer_support_pgdata under a new prefix — silently abandoning the
# database rather than failing.
name: customer_support
services:
  pgvector:
    image: pgvector/pgvector:0.8.6-pg18
    container_name: customer_support_pg
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    environment:
      # The image wants POSTGRES_USER/DB; the app's .env calls them
      # POSTGRES_USERNAME/POSTGRES_MAIN_DATABASE. Compose substitutes them from the
      # project's .env, so the credentials are defined in exactly one place.
      - POSTGRES_USER=${POSTGRES_USERNAME}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_MAIN_DATABASE}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - backend
    restart: unless-stopped

  app:
    build:
      # The repo root: Dockerfile copies src/, uv.lock and data/ from here.
      context: ..
      # Relative to the context, not to this file.
      dockerfile: docker/Dockerfile
    container_name: customer_support_api
    # Everything the app needs, read at run time. Compose's dotenv parser strips the
    # quotes and the spaces around `=` that this file uses, so it is consumed as-is.
    # Relative to this file, so it has to climb out of docker/.
    env_file: ../.env
    environment:
      # Inside the compose network Postgres answers to its service name, not
      # localhost. Values set here override the same keys from env_file, and the
      # image deliberately contains no .env for them to fight with.
      POSTGRES_HOST: pgvector
      POSTGRES_PORT: 5432
    depends_on:
      pgvector:
        # Wait for pg_isready, not just for the container to exist: the first
        # migration would otherwise race Postgres' own initdb on a fresh volume.
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      # Uploaded handbooks and the local Qdrant store. A named volume keeps them
      # across image rebuilds; assets/ is gitignored and never enters the image.
      - assets:/app/assets
    healthcheck:
      # python rather than curl, so the runtime image needs no extra packages.
      test:
        - CMD
        - python
        - -c
        - |
          import sys, urllib.request
          sys.exit(0 if urllib.request.urlopen("http://127.0.0.1:8000/", timeout=3).status == 200 else 1)
      interval: 15s
      timeout: 5s
      retries: 5
      # Generous: the first start also runs alembic upgrade head.
      start_period: 40s
    networks:
      - backend
    restart: unless-stopped

networks:
  backend: {}

volumes:
  pgdata:
  assets:
