server {
    listen 80;
    server_name localhost;

    # Scrapes reach the app directly over the compose network (prometheus scrapes
    # fastapi:8000), so the metrics endpoint never needs a public route. It is
    # blocked here rather than left to the obscure path: `location /` below already
    # proxies every path, so an unlisted one is not hidden from anybody who guesses
    # or reads the config.
    location = /TrhBVe {
        deny all;
    }

    # Defence in depth behind the API key, which is the real control.
    #
    # `location /` below proxies every path, so before this the advisor and operator
    # routes were reachable from anywhere that could reach port 80 — the one port
    # bound to 0.0.0.0. Restricting them to private ranges means that even with the
    # key leaked, the blast radius is whoever is already on the network.
    #
    # Private ranges rather than a single address: requests from the host arrive via
    # the docker bridge gateway (172.x), so a laptop demo keeps working while the
    # public internet does not. Narrow these to the advisor subnet in a real
    # deployment — and note nginx evaluates allow/deny in order, first match wins.
    location ~ ^/api/v1/(escalation|admin|profile) {
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;

        proxy_pass http://fastapi:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 5s;
    }

    location / {
        proxy_pass http://fastapi:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The pipeline makes up to five model calls; the default 60s read timeout
        # would cut a slow-but-working answer off at the proxy and return 504.
        proxy_read_timeout 120s;
        proxy_connect_timeout 5s;
    }
}
