[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "customer-support"
version = "0.1.0"
description = "Handbook support agent for CS/IS students with confidence-gated escalation to human advisors"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Omar Amir" }]
requires-python = ">=3.13"
dependencies = [
    # API
    "fastapi>=0.138.0",
    "uvicorn>=0.49.0",
    "python-multipart>=0.0.32",
    "aiofiles>=25.1.0",
    # config & validation
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    # database
    "sqlalchemy>=2.0.51",
    "asyncpg>=0.31.0",
    "psycopg2-binary>=2.9.10",
    "alembic>=1.18.5",
    # vector store
    "qdrant-client>=1.18.0",
    # LLM providers
    "openai>=2.52.0",
    "cohere>=7.0.8",
    # document loading & chunking
    "langchain-core>=1.0.0",
    # Pinned BELOW 0.4 on purpose, and this pin is load-bearing.
    #
    # ragas imports `langchain_community.chat_models.vertexai` at module level, but
    # declares `langchain-community` with no version bound — so a resolver picks the
    # newest, 0.4.x emptied its chat_models package as part of being sunset, and
    # `import ragas` dies with ModuleNotFoundError. 0.3.31 still ships that module and
    # still accepts langchain-core 1.x, so nothing else has to move.
    #
    # Bumping this to 0.4 breaks the RAGAS evaluation harness. We use exactly two
    # symbols from this package (PyMuPDFLoader, TextLoader in ProcessController), both
    # replaceable in ~15 lines — doing that would let the pin go away entirely.
    "langchain-community>=0.3.31,<0.4",
    "langchain-text-splitters>=1.0.0",
    "pymupdf>=1.28.0",
    "pgvector>=0.5.0",
    "nltk>=3.10.3",
    "langgraph>=1.2.11",
    "langgraph-checkpoint-postgres>=3.1.2",
    "psycopg[binary,pool]>=3.3.6",
    "structlog>=26.1.0",
    "prometheus-client>=0.26.0",
    "fastapi-health>=0.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "pytest-asyncio>=1.0",
    "httpx>=0.28",
    "ruff>=0.12",
    "pre-commit>=4.0",
    "locust>=2.32",
    "dvc>=3.67",
    # Upper bound is deliberate. ragas restructured its metric API in 0.4 and says
    # the `ragas.metrics` import path is removed in v1.0 (the metrics move to
    # `ragas.metrics.collections`). Three of the four metrics we need already live
    # there; answer relevancy (ResponseRelevancy) does not yet, so the harness uses
    # the older path for all four rather than importing from two places.
    # Revisit when v1.0 lands — and expect it to break the harness.
    "ragas>=0.4,<0.5",
    "datasets>=3.0",
    # Keep in step with the mlflow server image in docker/docker-compose.yml.
    # The 3.x API differs from the 2.x one most tutorials show.
    "mlflow>=3.16,<4",
]
notebooks = [
    "jupyter>=1.1.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/customer_support"]

# ---------- pytest ----------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# No --cov-fail-under yet: the suite covers the pure logic (gates, transitions) and
# real coverage is well under any useful gate, so a threshold here only makes
# `uv run pytest` fail for reasons unrelated to the change under test. Re-add one
# once the controller/router tests land.
addopts = "-ra --cov=customer_support --cov-report=term-missing"
markers = [
    "integration: needs running Postgres/Qdrant (docker compose up)",
]

# ---------- ruff ----------
[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
# A package's __init__.py re-exports the names that make up its public API. Those
# imports look unused to F401 precisely because nothing in the file uses them —
# every OTHER module does, via `from customer_support.controllers import X`.
# Deleting them would not clean anything up; it would break the imports.
"**/__init__.py" = ["F401"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency injection IS a call in an argument default — that is the
# documented API, not an oversight, and "fixing" it would break injection. Listed
# here rather than silenced with a blanket B008 ignore, so a genuinely mutable
# default in a non-FastAPI signature is still caught.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.Path",
]

[tool.ruff.format]
quote-style = "double"
