[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "customer-support"
version = "0.1.0"
description = "Handbook support agent for CS/IS students with confidence-gated escalation to human advisors"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Omar Amir" }]
requires-python = ">=3.13"
dependencies = [
    # API
    "fastapi>=0.138.0",
    "uvicorn>=0.49.0",
    "python-multipart>=0.0.32",
    "aiofiles>=25.1.0",
    # config & validation
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    # database
    "sqlalchemy>=2.0.51",
    "asyncpg>=0.31.0",
    "psycopg2-binary>=2.9.10",
    "alembic>=1.18.5",
    # vector store
    "qdrant-client>=1.18.0",
    # LLM providers
    "openai>=2.52.0",
    "cohere>=7.0.8",
    # document loading & chunking
    "langchain-core>=1.0.0",
    "langchain-community>=0.4.2",
    "langchain-text-splitters>=1.0.0",
    "pymupdf>=1.28.0",
    "pgvector>=0.5.0",
    "nltk>=3.10.3",
    "langgraph>=1.2.11",
    "langgraph-checkpoint-postgres>=3.1.2",
    "psycopg[binary,pool]>=3.3.6",
    "structlog>=26.1.0",
    "prometheus-client>=0.26.0",
    "starlette-exporter>=0.24.0",
    "fastapi-health>=0.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "pytest-asyncio>=1.0",
    "httpx>=0.28",
    "ruff>=0.12",
    "pre-commit>=4.0",
    "locust>=2.32",
]
notebooks = [
    "jupyter>=1.1.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/customer_support"]

# ---------- pytest ----------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# No --cov-fail-under yet: the suite covers the pure logic (gates, transitions) and
# real coverage is well under any useful gate, so a threshold here only makes
# `uv run pytest` fail for reasons unrelated to the change under test. Re-add one
# once the controller/router tests land.
addopts = "-ra --cov=customer_support --cov-report=term-missing"
markers = [
    "integration: needs running Postgres/Qdrant (docker compose up)",
]

# ---------- ruff ----------
[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.ruff.format]
quote-style = "double"
